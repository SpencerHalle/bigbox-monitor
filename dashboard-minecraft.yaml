title: Minecraft
views:
  - title: SMP
    path: smp
    icon: mdi:minecraft
    cards:
      - type: entities
        title: Now
        show_header_toggle: false
        entities:
          - entity: binary_sensor.bigbox_mc_online
            name: Server
          - entity: sensor.bigbox_mc_players
            name: Players online

      - type: markdown
        title: Online now
        content: |
          {% set p = state_attr('sensor.bigbox_mc_players','players') or [] %}
          {% if p %}{% for name in p %}
          - 🟢 **{{ name }}**
          {%- endfor %}
          {% else %}_Nobody online._{% endif %}

      - type: statistics-graph
        title: Players online — hourly peak (7 days)
        period: hour
        chart_type: bar
        stat_types:
          - max
        entities:
          - sensor.bigbox_mc_players

      - type: history-graph
        title: Who was on (7 days)
        hours_to_show: 168
        show_names: true
        entities:
          - binary_sensor.bigbox_mc_online
          - binary_sensor.bigbox_mc_carpace
          - binary_sensor.bigbox_mc_mary2333
          - binary_sensor.bigbox_mc_spencer_obamna
          # each new player gets a binary_sensor.bigbox_mc_<name> the first
          # time they log on — add the row here to pin it in this graph.

      - type: logbook
        title: Join / leave log
        hours_to_show: 168
        entities:
          # sensor.bigbox_mc_players carries the "X joined/left the SMP" lines
          # the monitor writes on every change, plus the raw count history.
          - sensor.bigbox_mc_players
          - binary_sensor.bigbox_mc_online

      - type: markdown
        content: >
          _The monitor polls every ~60s, so a login shorter than a minute can
          slip between samples. Each player also gets a
          `binary_sensor.bigbox_mc_<name>` entity — open the **History** panel
          and pick them to see each person's individual sessions._
